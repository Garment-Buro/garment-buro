name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --no-banner

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: garment_buro_ci
          POSTGRES_USER: garment_ci
          POSTGRES_PASSWORD: garment-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garment_ci -d garment_buro_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run quality gates
        run: make PYTHON=python check
      - name: Exercise migrations on PostgreSQL
        env:
          APP_ENV: test
          DATABASE_ENABLED: "true"
          DATABASE_URL: postgresql+asyncpg://garment_ci:garment-ci-only@127.0.0.1:5432/garment_buro_ci
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini downgrade base
          python -m alembic -c alembic.ini upgrade head

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run quality gates
        run: npm run check

  deployment:
    name: Deployment descriptors
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: development
      APP_ENV: staging
      PUBLIC_BASE_URL: https://dev.garment-buro.ru
      BACKEND_IMAGE: example/backend:ci
      FRONTEND_IMAGE: example/frontend:ci
      POSTGRES_DB: garment_role_ci
      POSTGRES_USER: garment_owner
      POSTGRES_PASSWORD: owner-ci-only
      DATABASE_APP_USER: garment_app
      DATABASE_APP_PASSWORD: app-ci-only
      MINIO_ACCESS_KEY: minio-ci
      MINIO_SECRET_KEY: minio-secret-ci
      MINIO_BUCKET_PREFIX: garment-buro
      FRONTEND_HOST_PORT: "3199"
      BACKEND_HOST_PORT: "8199"
      MINIO_HOST_PORT: "9199"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Compose and PostgreSQL runtime role
        shell: bash
        run: |
          touch deploy/.env
          compose=(docker compose --project-name garment-role-ci -f deploy/docker-compose.server.yml)
          cleanup() { "${compose[@]}" down -v --remove-orphans >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --wait postgres
          "${compose[@]}" run --rm database-role-init
          "${compose[@]}" run --rm database-role-init
          "${compose[@]}" exec -T postgres psql \
            -U garment_owner -d garment_role_ci -v ON_ERROR_STOP=1 \
            -c 'CREATE TABLE role_smoke (id bigserial PRIMARY KEY, value text NOT NULL);'
          "${compose[@]}" exec -T -e PGPASSWORD=app-ci-only postgres psql \
            -U garment_app -d garment_role_ci -v ON_ERROR_STOP=1 \
            -c "INSERT INTO role_smoke(value) VALUES ('ok'); UPDATE role_smoke SET value='updated'; DELETE FROM role_smoke;"

          role_flags=$("${compose[@]}" exec -T postgres psql \
            -U garment_owner -d garment_role_ci -Atc \
            "SELECT rolsuper::int || ':' || rolcreatedb::int || ':' || rolcreaterole::int || ':' || rolreplication::int FROM pg_roles WHERE rolname='garment_app';")
          test "$role_flags" = "0:0:0:0"
          if "${compose[@]}" exec -T -e PGPASSWORD=app-ci-only postgres psql \
            -U garment_app -d garment_role_ci -v ON_ERROR_STOP=1 \
            -c 'CREATE TABLE must_be_denied (id int);' >/dev/null 2>&1; then
            exit 1
          fi

  containers:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, frontend, deployment]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: garment-buro-backend:ci
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,mode=max,scope=ci-backend
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: garment-buro-frontend:ci
          build-args: |
            NEXT_PUBLIC_IDENTITY_SESSION_V2_ENABLED=false
            NEXT_PUBLIC_CATALOG_WRITES_ENABLED=false
            NEXT_PUBLIC_CRM_CABINET_ENABLED=false
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,mode=max,scope=ci-frontend
