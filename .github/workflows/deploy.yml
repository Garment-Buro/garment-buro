name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Check production access and release prerequisites without changing services
        type: boolean
        default: false
      root_preflight:
        description: Use the temporary root bootstrap credential for read-only proxy inspection
        type: boolean
        default: false
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
  BACKEND_IMAGE: ghcr.io/garment-buro/garment-buro-backend:${{ github.ref_name == 'main' && 'production' || 'development' }}-${{ github.sha }}
  FRONTEND_IMAGE: ghcr.io/garment-buro/garment-buro-frontend:${{ github.ref_name == 'main' && 'production' || 'development' }}-${{ github.sha }}

jobs:
  production-preflight:
    name: Read-only production preflight
    if: github.event_name == 'workflow_dispatch' && inputs.preflight_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: garment-buro-server-cutover
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH connection
        shell: bash
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/garment_buro_ci
          chmod 0600 ~/.ssh/garment_buro_ci
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Inspect access and release metadata only
        env:
          ROOT_PREFLIGHT: ${{ inputs.root_preflight }}
          SSHPASS: ${{ inputs.root_preflight && secrets.ROOT_BOOTSTRAP_PASSWORD || '' }}
        shell: bash
        run: |
          connection=(ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" -i ~/.ssh/garment_buro_ci -o IdentitiesOnly=yes)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          if [[ "$ROOT_PREFLIGHT" == true ]]; then
            test -n "$SSHPASS"
            if ! command -v sshpass >/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq sshpass
            fi
            connection=(sshpass -e ssh -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT")
            target="root@$DEPLOY_HOST"
          fi
          "${connection[@]}" "$target" 'bash -s' <<'REMOTE'
          set -euo pipefail
          printf 'deploy_uid=%s\n' "$(id -u)"
          if sudo -n true >/dev/null 2>&1; then echo sudo_without_password=yes; else echo sudo_without_password=no; fi
          for path in /home/plus2opacity/nginx.conf /var/run/docker.sock /srv/garment-buro /srv/garment-buro/production; do
            if test -e "$path"; then
              stat -c '%a %U %G %n' "$path"
              if test -w "$path"; then printf 'writable=%s\n' "$path"; fi
            fi
          done
          df -h /srv/garment-buro
          docker info --format '{{json .SecurityOptions}}'
          docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
          if test -f /srv/garment-buro/production/.release; then
            grep -E '^(REVISION|DEPLOYED_AT|BACKEND_IMAGE|FRONTEND_IMAGE)=' /srv/garment-buro/production/.release || true
          fi
          if test -d /srv/garment-buro/maintenance; then
            stat -c '%a %U %n' /srv/garment-buro/maintenance
            find /srv/garment-buro/maintenance -maxdepth 1 -type f -name '*.active' -printf '%f\n'
          fi
          if test "$(id -u)" = 0; then
            python3 - <<'PY'
          import json, pathlib, re, subprocess
          path = pathlib.Path('/home/plus2opacity/nginx.conf')
          source = path.read_text()
          print(json.dumps({'nginxSource': str(path), 'serverNames': re.findall(r'server_name\s+([^;]+)', source), 'includes': re.findall(r'include\s+([^;]+)', source), 'upstreams': re.findall(r'proxy_pass\s+([^;]+)', source)}))
          names = subprocess.check_output(['docker', 'ps', '--format', '{{.Names}}'], text=True).splitlines()
          for name in names:
              labels = json.loads(subprocess.check_output(['docker', 'inspect', '--format', '{{json .Config.Labels}}', name], text=True)) or {}
              if labels.get('com.docker.compose.service') == 'nginx':
                  raw_mounts = json.loads(subprocess.check_output(['docker', 'inspect', '--format', '{{json .Mounts}}', name], text=True))
                  mounts = [{key: mount[key] for key in ['Source', 'Destination', 'RW']} for mount in raw_mounts]
                  image = subprocess.check_output(['docker', 'inspect', '--format', '{{.Config.Image}}', name], text=True).strip()
                  print(json.dumps({'proxyContainer': name, 'image': image, 'composeFiles': labels.get('com.docker.compose.project.config_files'), 'mounts': mounts}))
                  result = subprocess.run(['docker', 'exec', name, 'nginx', '-T'], capture_output=True, text=True, check=True)
                  sections = re.split(r'# configuration file ([^\n]+):\n', result.stdout)
                  for index in range(1, len(sections), 2):
                      hosts = re.findall(r'server_name\s+([^;]+)', sections[index + 1])
                      if hosts:
                          print(json.dumps({'nginxFile': sections[index], 'serverNames': hosts}))
          PY
          fi
          REMOTE

  quality:
    if: (!inputs.preflight_only) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Publish GHCR images
    if: '!inputs.preflight_only'
    runs-on: ubuntu-latest
    needs: quality
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}
            ghcr.io/garment-buro/garment-buro-backend:${{ env.DEPLOY_ENV }}
          cache-from: type=gha,scope=release-backend
          cache-to: type=gha,mode=max,scope=release-backend
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}
            ghcr.io/garment-buro/garment-buro-frontend:${{ env.DEPLOY_ENV }}
          build-args: |
            NEXT_PUBLIC_IDENTITY_SESSION_V2_ENABLED=${{ vars.NEXT_PUBLIC_IDENTITY_SESSION_V2_ENABLED || 'true' }}
            NEXT_PUBLIC_CATALOG_WRITES_ENABLED=${{ vars.NEXT_PUBLIC_CATALOG_WRITES_ENABLED || 'true' }}
            NEXT_PUBLIC_CRM_CABINET_ENABLED=${{ vars.NEXT_PUBLIC_CRM_CABINET_ENABLED || 'false' }}
            NEXT_PUBLIC_YANDEX_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_YANDEX_MAPS_API_KEY }}
          cache-from: type=gha,scope=release-frontend-${{ env.DEPLOY_ENV }}
          cache-to: type=gha,mode=max,scope=release-frontend-${{ env.DEPLOY_ENV }}

  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build
    concurrency:
      group: garment-buro-server-cutover
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ github.ref_name == 'main' && 'https://garment-buro.ru' || 'https://dev.garment-buro.ru' }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout deployment descriptors
        uses: actions/checkout@v7
      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/garment_buro_ci
          chmod 0600 ~/.ssh/garment_buro_ci
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  ConnectTimeout 15\n  ConnectionAttempts 3\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n  StrictHostKeyChecking yes\n' >~/.ssh/config
      - name: Upload deployment descriptors
        shell: bash
        run: |
          target="/srv/garment-buro/$DEPLOY_ENV"
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/garment_buro_ci -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$target'"
          scp -P "$DEPLOY_PORT" -i ~/.ssh/garment_buro_ci -o IdentitiesOnly=yes \
            deploy/docker-compose.server.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$target/docker-compose.next.yml"
          scp -P "$DEPLOY_PORT" -i ~/.ssh/garment_buro_ci -o IdentitiesOnly=yes \
            deploy/scripts/remote-deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$target/remote-deploy.next.sh"
          scp -P "$DEPLOY_PORT" -i ~/.ssh/garment_buro_ci -o IdentitiesOnly=yes \
            deploy/scripts/backup-server.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$target/backup-server.next.sh"
          scp -P "$DEPLOY_PORT" -i ~/.ssh/garment_buro_ci -o IdentitiesOnly=yes \
            deploy/scripts/verify-backup.py \
            "$DEPLOY_USER@$DEPLOY_HOST:$target/verify-backup.next.py"
          scp -P "$DEPLOY_PORT" -i ~/.ssh/garment_buro_ci -o IdentitiesOnly=yes \
            deploy/scripts/public-maintenance.py \
            "$DEPLOY_USER@$DEPLOY_HOST:$target/public-maintenance.next.py"
      - name: Pull and deploy release
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            ssh -p "$DEPLOY_PORT" -i ~/.ssh/garment_buro_ci -o IdentitiesOnly=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/garment_buro_ci -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '/srv/garment-buro/$DEPLOY_ENV/remote-deploy.next.sh' \
              '$DEPLOY_ENV' '$BACKEND_IMAGE' '$FRONTEND_IMAGE' '${{ github.sha }}'"
      - name: Remove temporary registry login
        if: always()
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/garment_buro_ci -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "docker logout ghcr.io"
      - name: Verify public surfaces
        shell: bash
        run: |
          if [[ "$DEPLOY_ENV" == production ]]; then
            urls=(https://garment-buro.ru/ https://www.garment-buro.ru/ https://partner.garment-buro.ru/partner https://production.garment-buro.ru/production https://production.garment-buro.ru/production/admin)
          else
            urls=(https://dev.garment-buro.ru/)
          fi
          for url in "${urls[@]}"; do
            curl --fail --silent --show-error --location --max-time 30 --retry 3 "$url" -o /dev/null
          done
