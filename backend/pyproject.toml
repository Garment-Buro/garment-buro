[tool.pytest.ini_options]
testpaths = ["tests", "test_image_optimization.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["app", "cdek_client", "email_service", "payments"]
