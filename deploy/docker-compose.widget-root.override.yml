services:
  garment-widget:
    build:
      args:
        NEXT_PUBLIC_BASE_PATH: ""
    environment:
      NEXT_PUBLIC_BASE_PATH: ""
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
