# Install as /etc/nginx/garment-buro/server-logging.conf, include in EVERY server.
# Override any inherited combined access log, including HTTP redirects/bootstrap.
access_log /var/log/nginx/access.log garment_safe;

# Nginx request errors include raw request/upstream URLs and cannot be redacted
# with log_format. Use the safe access event (incl. 4xx/5xx and upstream timing)
# and backend route-template events for diagnostics. Main-process startup/config
# errors retain the enclosing main error_log; never enable HTTP debug logging.
error_log /dev/null;
