# Install once as /etc/nginx/conf.d/00-garment-logging.conf (http context).
# Only constant route categories: neither $uri nor $request_uri is safe to log.
map $uri $garment_log_route {
    default page;
    ~^/api/design-media(?:/|$) design-media;
    ~^/storage(?:/|$) storage;
    /_next/image image-optimizer;
    ~^/api/auth(?:/|$) auth;
    ~^/api/checkout(?:/|$) checkout;
    ~^/api/orders(?:/|$) orders;
    ~^/api/cart(?:/|$) cart;
    ~^/api/(?:customer|profile|projects)(?:/|$) customer;
    ~^/api/ api;
    ~^/(?:_next/static|uploads|mock|production|service-home)/ asset;
    ~^/\.well-known/acme-challenge/ acme;
}

map $request_method $garment_log_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}

# $server_name comes from configuration, unlike client-controlled $host.
# Never add URL, query, Referer, user agent, cookies, authorization or request body.
log_format garment_safe escape=json
    '{"timestamp":"$time_iso8601","request_id":"$request_id",'
    '"server":"$server_name","method":"$garment_log_method",'
    '"route":"$garment_log_route","status":$status,'
    '"bytes":$body_bytes_sent,"duration_seconds":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"upstream_seconds":"$upstream_response_time"}';
