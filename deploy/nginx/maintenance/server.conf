# Included only in HTTPS vhosts belonging to this deployment environment.
# The caller sets $garment_deployment_environment to production/development.
# Persist the directory and bind-mount it (not an individual inode) into Docker nginx.
open_file_cache off;
set $garment_gate_signature "";
set $garment_gate_cache_control "";
set $garment_gate_retry_after "";
add_header X-Garment-Deployment-Gate $garment_gate_signature always;
add_header Cache-Control $garment_gate_cache_control always;
add_header Retry-After $garment_gate_retry_after always;
if (-f /srv/garment-buro/maintenance/$garment_deployment_environment.active) {
    set $garment_gate_signature "$garment_deployment_environment/1";
    set $garment_gate_cache_control "no-store";
    set $garment_gate_retry_after "60";
    return 503 '<!doctype html><meta charset="utf-8"><title>Обновление</title><p>Идёт обновление. Попробуйте через минуту.</p>\n';
}
location = /_garment/deployment-gate {
    add_header X-Garment-Deployment-Gate "$garment_deployment_environment/1" always;
    add_header Cache-Control "no-store" always;
    return 204;
}
