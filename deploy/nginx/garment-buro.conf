map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name garment-buro.ru www.garment-buro.ru dev.garment-buro.ru
        partner.garment-buro.ru widget.garment-buro.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name garment-buro.ru www.garment-buro.ru;

    ssl_certificate /etc/letsencrypt/live/garment-buro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garment-buro.ru/privkey.pem;

    client_max_body_size 100m;

    location /storage/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.garment-buro.ru;

    ssl_certificate /etc/letsencrypt/live/garment-buro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garment-buro.ru/privkey.pem;

    client_max_body_size 100m;

    location /storage/ {
        proxy_pass http://127.0.0.1:9100/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name partner.garment-buro.ru;

    ssl_certificate /etc/letsencrypt/live/garment-buro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garment-buro.ru/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name widget.garment-buro.ru;

    ssl_certificate /etc/letsencrypt/live/garment-buro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garment-buro.ru/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
}
